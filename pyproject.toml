[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Literal browser/bot user-agent strings — wrapping them would make them harder to read, not easier.
"scripts/audit_crawl.py" = ["E501"]

[tool.pytest.ini_options]
filterwarnings = [
    # bs4 4.12.3 passes a no-op option to lxml 5.3; harmless, fixed upstream in newer bs4.
    "ignore:The 'strip_cdata' option of HTMLParser:DeprecationWarning",
]

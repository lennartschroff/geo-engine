# Runs on every push and pull request: lint, validate data, run both test
# suites, and make sure app/data.js is what build_web_data.py would produce
# (catches "edited data/*.json but forgot to rebuild").
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: ruff
        run: ruff check .
      - name: validate data/*.json against schemas/*.schema.json
        run: python scripts/validate_data.py
      - name: pytest
        run: pytest tests/ -v
      - name: monitoring dry-run smoke test (zero API cost)
        run: |
          python monitoring/run.py --dry-run --questions q1,q2 --engines claude,gpt,gemini --runs 1 --variants 0 --db /tmp/ci-check.sqlite
          python -c "
          import sqlite3
          n = sqlite3.connect('/tmp/ci-check.sqlite').execute('SELECT COUNT(*) FROM runs').fetchone()[0]
          assert n == 6, f'expected 6 rows, got {n}'
          print('monitoring dry-run wrote', n, 'rows as expected')
          """
          python monitoring/run.py --dry-run --questions q1 --engines claude --runs 1 --variants 1 --seed 1 --db /tmp/ci-var.sqlite
          python -c "
          import sqlite3
          rows = sqlite3.connect('/tmp/ci-var.sqlite').execute('SELECT variant, question_text FROM runs').fetchall()
          assert sorted(r[0] for r in rows) == [0, 1], rows
          print('variant rows:', rows)
          "
      - name: Question Radar smoke test (zero API cost)
        run: |
          python monitoring/radar.py --db /tmp/ci-var.sqlite --target data
          python monitoring/radar.py probe --dry-run --engines claude --top 2 --db /tmp/ci-var.sqlite --target data
          python monitoring/radar.py --json --db /tmp/ci-var.sqlite --target data > /tmp/radar.json
          python -c "
          import json
          d = json.load(open('/tmp/radar.json'))
          assert d['candidates'] and any(c['open_measured'] for c in d['candidates']), d
          print('radar candidates:', len(d['candidates']))
          "
      - name: rebuild app/data.js and check it matches what's committed
        run: |
          python scripts/build_web_data.py
          git diff --exit-code app/data.js || {
            echo "::error::app/data.js is stale — run 'python3 scripts/build_web_data.py' and commit the result.";
            exit 1;
          }

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: node --test (app/core.js, app/charts.js)
        run: node --test tests/core.test.js tests/charts.test.js

# Scheduled monitoring (TASKS.md C6).
#
# Cadence, runs, variants, engines and budget all live in
# data/monitoring_settings.json -- edit that file, not this one. GitHub's
# cron can't read a file, so this wakes up daily and monitoring/schedule.py
# decides whether a run is due; on other days (and always while the
# frequency is "off") the job ends after a few seconds without installing
# anything or calling any API.
#
# Started by hand (Run workflow), "size" picks what to ask:
#   test = the first key question once per engine, no variants (~$0.05)
#   full = the whole run list, like a scheduled run
#
# API keys come from encrypted repository secrets (Settings -> Secrets and
# variables -> Actions): ANTHROPIC_API_KEY, OPENAI_API_KEY, GEMINI_API_KEY.
# An engine whose secret is missing is skipped, not an error.
#
# Question Radar (monitoring/radar.py collect): every Monday, even while
# monitoring is "off", the job also collects public questions and topic
# momentum (Hacker News, Stack Exchange, GitHub, Wikipedia). Free, no API
# keys; uses the job's own GITHUB_TOKEN for GitHub search. Momentum and the
# hit-rate log need weekly history, so this keeps running on its own.
#
# Results are NOT committed to the repo (keeps you the sole commit author and
# keeps the database out of git, per CLAUDE.md). Each run restores the
# previous run's database artifact, appends to it, and uploads it again as
# "monitoring-results" (runs.sqlite + monitoring_export.json). Download it
# from the run page and load monitoring_export.json in the app
# (Monitor -> Sources -> "Load monitoring results").
name: Scheduled monitoring
on:
  schedule:
    - cron: "0 5 * * *" # daily 05:00 UTC = 06:00 Berlin (07:00 in summer)
  workflow_dispatch:
    inputs:
      size:
        description: "test = 1 question per engine (~$0.05), full = every question in the run list"
        type: choice
        options: [test, full]
        default: test
permissions:
  contents: read
  actions: read # to download the previous run's database artifact
concurrency:
  group: monitoring
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Is a run due?
        id: due
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            echo "radar=true" >> "$GITHUB_OUTPUT"
          else
            python monitoring/schedule.py | tee -a "$GITHUB_OUTPUT"
            # Radar collection: free, weekly on Mondays, independent of the monitoring cadence.
            if [ "$(date -u +%u)" = "1" ]; then echo "radar=true" >> "$GITHUB_OUTPUT"; else echo "radar=false" >> "$GITHUB_OUTPUT"; fi
          fi

      - name: Install dependencies
        if: steps.due.outputs.due == 'true' || steps.due.outputs.radar == 'true'
        run: pip install -r requirements.txt

      - name: Restore previous results database
        if: steps.due.outputs.due == 'true' || steps.due.outputs.radar == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Non-due days also finish as "success" but upload nothing, so look
          # back far enough to cover a monthly cadence.
          for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow monitoring.yml --status success \
                        --limit 60 --json databaseId -q '.[].databaseId'); do
            if gh run download "$id" --repo "$GITHUB_REPOSITORY" --name monitoring-results --dir prev 2>/dev/null; then
              cp prev/runs.sqlite monitoring/runs.sqlite
              echo "Restored database from run $id"
              exit 0
            fi
          done
          echo "No previous database found -- starting a new one."

      - name: Run monitoring
        if: steps.due.outputs.due == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Budget caps from the settings file still apply; --yes only skips
          # the interactive confirmation, which a scheduled job can't answer.
          set +e
          extra=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.size }}" != "full" ]; then
            extra="--questions q1 --variants 0"
            echo "Test run: one question per engine."
          fi
          python monitoring/run.py --yes $extra
          code=$?
          if [ "$code" = "2" ]; then
            echo "::warning::Some engines failed this run; results from the others were saved."
            exit 0
          fi
          exit "$code"

      - name: Collect Question Radar data (free)
        if: always() && steps.due.outputs.radar == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Failed requests are logged and skipped; never fail the job over them.
          python monitoring/radar.py collect || echo "::warning::Radar collection failed; monitoring results are unaffected."

      - name: Export for the app
        if: always() && (steps.due.outputs.due == 'true' || steps.due.outputs.radar == 'true') && hashFiles('monitoring/runs.sqlite') != ''
        run: python scripts/export_monitoring.py

      - name: Upload results
        if: always() && (steps.due.outputs.due == 'true' || steps.due.outputs.radar == 'true') && hashFiles('monitoring/runs.sqlite') != ''
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-results
          path: |
            monitoring/runs.sqlite
            monitoring/monitoring_export.json
          retention-days: 90
          if-no-files-found: warn
